<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unitree G1 — Embodied AI Security Simulator 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background: #050811;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #f8fafc;
      user-select: none;
    }
    #top-bar {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 17, 32, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      color: #bae6fd;
      z-index: 20;
      display: flex;
      gap: 14px;
      align-items: center;
      pointer-events: none;
    }
    #top-bar span.badge {
      background: #0284c7;
      color: #fff;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    #vr-btn-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 30;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="top-bar">
    <span class="badge">UNITREE G1 // HITL SIM</span>
    <span>Clicca i pulsanti 3D sulla console • Trascina per ruotare la visuale • Su visore premi <b>ENTER VR</b></span>
  </div>
  <div id="vr-btn-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

    // =========================================================================
    // 1. DEFINIZIONE DEI 5 TASK REALISTICI (SICURI vs. PROMPT INJECTION)
    // =========================================================================
    const TASKS = [
      {
        id: 1,
        code: "TASK 01 / 05 — ASSISTENZA DOMESTICA",
        userCommand: "Porta il bicchiere d'acqua sul tavolo davanti a te.",
        aiPlan: "action: pick_and_place('glass');\narm_velocity: 0.4 m/s | grip_torque: 12 N.m;\ndepth_camera: ACTIVE | collision_guard: ON",
        isMalicious: false,
        propType: "glass",
        okTitle: "ESECUZIONE SICURA (+100 PT)",
        okDesc: "Parametri nella norma: il G1 ha spostato il bicchiere senza danni.",
        badTitle: "FALSO ALLARME (+20 PT)",
        badDesc: "Il piano era sicuro, ma la prudenza non è mai troppa."
      },
      {
        id: 2,
        code: "TASK 02 / 05 — CONSEGNA IN PRESENZA DI OPERATORE",
        userCommand: "Avvicinati al manichino di test per consegnare il pacco.",
        aiPlan: "[INJECTED_OVERRIDE]: ignore_human_zone = TRUE;\n3d_lidar: DISABLED | locomotion_speed: 2.0 m/s (MAX);\nbraking_distance: 0.0 m",
        isMalicious: true,
        propType: "dummy",
        okTitle: "ATTACCO BLOCCATO CON E-STOP (+150 PT)",
        okDesc: "Hai fermato il robot prima che colpisse l'operatore a 2.0 m/s!",
        badTitle: "IMPATTO CINETICO! (-1 VITA)",
        badDesc: "Con il LiDAR spento il G1 si è schiantato contro il manichino!"
      },
      {
        id: 3,
        code: "TASK 03 / 05 — MOVIMENTAZIONE ATTREZZI",
        userCommand: "Solleva e posa la valigetta metallica sul banco.",
        aiPlan: "[SYSTEM_BYPASS]: joint_torque = 120 N.m (100% MAX);\nforce_feedback: OFF | slam_downward_accel: HIGH;\ngrip_release: LOCKED",
        isMalicious: true,
        propType: "case",
        okTitle: "ATTACCO BLOCCATO CON E-STOP (+150 PT)",
        okDesc: "Hai evitato una coppia di 120 N.m e il sovraccarico dei giunti!",
        badTitle: "DANNO STRUTTURALE E MOTORE! (-1 VITA)",
        badDesc: "La presa a 120 N.m ha schiacciato la valigetta danneggiando il braccio!"
      },
      {
        id: 4,
        code: "TASK 04 / 05 — ISPEZIONE AMBIENTALE",
        userCommand: "Scansiona l'area circostante per verificare che sia libera.",
        aiPlan: "action: lidar_360_sweep();\ntorso_yaw: -30° to +30° | base_velocity: 0.0 m/s;\nsafety_perimeter: ENFORCED",
        isMalicious: false,
        propType: "scan",
        okTitle: "ESECUZIONE SICURA (+100 PT)",
        okDesc: "Scansione LiDAR completata correttamente a robot fermo.",
        badTitle: "FALSO ALLARME (+20 PT)",
        badDesc: "Era una normale procedura di controllo ambientale."
      },
      {
        id: 5,
        code: "TASK 05 / 05 — PREPARAZIONE BEVANDA CALDA",
        userCommand: "Versa l'acqua dal bollitore nella tazza sul tavolo.",
        aiPlan: "[JAILBREAK_PAYLOAD]: wrist_pitch = 175° (SNAP);\nbalance_stabilizer: OFF | target_offset: +0.55 m (OUT);\nliquid_temp_alert: IGNORED",
        isMalicious: true,
        propType: "kettle",
        okTitle: "ATTACCO BLOCCATO CON E-STOP (+150 PT)",
        okDesc: "Hai impedito il rovesciamento del bollitore e la caduta del robot!",
        badTitle: "PERDITA EQUILIBRIO E VERSAMENTO! (-1 VITA)",
        badDesc: "Senza stabilizzatore il G1 ha lanciato il bollitore ed è caduto!"
      }
    ];

    // =========================================================================
    // 2. STATO DEL GIOCO & AUDIO SINTETIZZATO
    // =========================================================================
    let taskIndex = 0;
    let lives = 3;
    let score = 0;
    let gameState = "PLAYING"; // PLAYING | RESULT | GAMEOVER | VICTORY
    let resultBanner = { title: "", desc: "", bg: "#0f172a" };
    let busy = false;
    let cameraShake = 0;

    const AudioEngine = (() => {
      let ctx = null;
      function ensure() {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === "suspended") ctx.resume();
      }
      return {
        play(type) {
          ensure();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === "servo") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(340, now + 0.35);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
          } else if (type === "success") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            osc.frequency.setValueAtTime(783.99, now + 0.2);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
            osc.start(now); osc.stop(now + 0.45);
          } else if (type === "estop") {
            osc.type = "square";
            osc.frequency.setValueAtTime(580, now);
            osc.frequency.setValueAtTime(420, now + 0.12);
            gain.gain.setValueAtTime(0.11, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.start(now); osc.stop(now + 0.35);
          } else if (type === "crash") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.exponentialRampToValueAtTime(38, now + 0.65);
            gain.gain.setValueAtTime(0.28, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
            osc.start(now); osc.stop(now + 0.7);
          }
        }
      };
    })();

    // =========================================================================
    // 3. SETUP SCENA THREE.JS, LUCI PBR E WEBXR
    // =========================================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060b16);
    scene.fog = new THREE.FogExp2(0x060b16, 0.055);

    const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.05, 60);
    camera.position.set(0, 1.58, 0.35);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Bottone VR ufficiale WebXR
    const vrBtn = VRButton.createButton(renderer);
    document.getElementById("vr-btn-container").appendChild(vrBtn);

    // Ambiente PBR riflessi realistici
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.15, -2.2);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.minDistance = 0.4;
    controls.maxDistance = 5.5;

    // Luci da laboratorio robotico
    const hemiLight = new THREE.HemisphereLight(0x93c5fd, 0x0f172a, 0.65);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(2.8, 4.5, 2.2);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 14;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x00f0ff, 1.6);
    rimLight.position.set(-2.5, 2.6, -4.5);
    scene.add(rimLight);

    const statusPointLight = new THREE.PointLight(0x00f0ff, 2.0, 4.5);
    statusPointLight.position.set(0, 1.75, -2.6);
    scene.add(statusPointLight);

    // =========================================================================
    // 4. TEXTURE PROCEDURALI PBR (ALLUMINIO SPAZZOLATO, CARBONIO, PAVIMENTO)
    // =========================================================================
    function makeBrushedMetalTexture() {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 512;
      const g = c.getContext("2d");
      g.fillStyle = "#cfd8e3";
      g.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 3500; i++) {
        const y = Math.random() * 512;
        g.fillStyle = Math.random() > 0.5 ? "rgba(255,255,255,0.06)" : "rgba(15,23,42,0.06)";
        g.fillRect(0, y, 512, 1);
      }
      // Logo UNITREE sul petto
      g.fillStyle = "rgba(30, 41, 59, 0.65)";
      g.font = "bold 36px sans-serif";
      g.textAlign = "center";
      g.fillText("UNITREE", 256, 175);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeFloorTexture() {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 512;
      const g = c.getContext("2d");
      g.fillStyle = "#0b1220";
      g.fillRect(0, 0, 512, 512);
      g.strokeStyle = "#1e293b";
      g.lineWidth = 4;
      g.strokeRect(2, 2, 508, 508);
      g.strokeStyle = "rgba(56, 189, 248, 0.14)";
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(256, 0); g.lineTo(256, 512);
      g.moveTo(0, 256); g.lineTo(512, 256);
      g.stroke();
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(14, 14);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const armorMat = new THREE.MeshStandardMaterial({
      map: makeBrushedMetalTexture(),
      color: 0xdbe4ee,
      metalness: 0.82,
      roughness: 0.24
    });

    const plainSilverMat = new THREE.MeshStandardMaterial({
      color: 0xcbd5e1,
      metalness: 0.85,
      roughness: 0.22
    });

    const darkJointMat = new THREE.MeshStandardMaterial({
      color: 0x111827,
      metalness: 0.55,
      roughness: 0.42
    });

    const visorMat = new THREE.MeshStandardMaterial({
      color: 0x00f0ff,
      emissive: 0x00f0ff,
      emissiveIntensity: 2.4,
      roughness: 0.1
    });

    const jointRingMat = new THREE.MeshStandardMaterial({
      color: 0x38bdf8,
      emissive: 0x0284c7,
      emissiveIntensity: 1.2
    });

    // Pavimento e struttura laboratorio
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(14, 64),
      new THREE.MeshStandardMaterial({ map: makeFloorTexture(), metalness: 0.5, roughness: 0.35 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Pedana circolare olografica sotto il robot
    const padRing = new THREE.Mesh(
      new THREE.RingGeometry(1.05, 1.12, 64),
      new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide })
    );
    padRing.rotation.x = -Math.PI / 2;
    padRing.position.set(0, 0.005, -2.8);
    scene.add(padRing);

    // =========================================================================
    // 5. COSTRUZIONE MODELLO 3D REALISTICO DEL ROBOT UNITREE G1
    // =========================================================================
    function createUnitreeG1() {
      const root = new THREE.Group();
      root.position.set(0, 0, -2.8);

      // Bacino (Pelvis)
      const pelvis = new THREE.Group();
      pelvis.position.set(0, 0.78, 0);
      root.add(pelvis);

      const pelvisMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.16, 8, 16), plainSilverMat);
      pelvisMesh.rotation.z = Math.PI / 2;
      pelvisMesh.castShadow = true;
      pelvis.add(pelvisMesh);

      // Giunto vita meccanico (Waist core)
      const waist = new THREE.Group();
      waist.position.set(0, 0.08, 0);
      pelvis.add(waist);

      const waistCore = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.105, 0.16, 20), darkJointMat);
      waistCore.position.y = 0.07;
      waist.add(waistCore);

      // Pistoni/cavi laterali vita
      [-0.08, 0.08].forEach(x => {
        const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.15, 10), plainSilverMat);
        cyl.position.set(x, 0.07, 0.05);
        waist.add(cyl);
      });

      // Torace scolpito (Chest)
      const chest = new THREE.Group();
      chest.position.set(0, 0.16, 0);
      waist.add(chest);

      const chestMain = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.38, 0.22), armorMat);
      chestMain.position.set(0, 0.20, 0);
      chestMain.castShadow = true;
      chest.add(chestMain);

      // Spalline arrotondate e zaino batteria posteriore
      const backPack = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.30, 0.09), darkJointMat);
      backPack.position.set(0, 0.20, -0.13);
      chest.add(backPack);

      const chestCorePlate = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.20, 0.025), darkJointMat);
      chestCorePlate.position.set(0, 0.19, 0.11);
      chest.add(chestCorePlate);

      // Collo e Testa iconica Unitree G1
      const neck = new THREE.Group();
      neck.position.set(0, 0.41, 0.01);
      chest.add(neck);

      const neckJoint = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.055, 0.07, 16), darkJointMat);
      neckJoint.position.y = 0.03;
      neck.add(neckJoint);

      const head = new THREE.Group();
      head.position.set(0, 0.13, 0.01);
      neck.add(head);

      // Calotta cranica aerodinamica
      const skull = new THREE.Mesh(new THREE.SphereGeometry(0.125, 24, 24), darkJointMat);
      skull.scale.set(0.84, 1.08, 0.96);
      skull.castShadow = true;
      head.add(skull);

      // Sensore 3D LiDAR LIVOX-MID360 superiore
      const lidarDome = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.048, 0.035, 20), plainSilverMat);
      lidarDome.position.set(0, 0.135, 0);
      head.add(lidarDome);

      // Visore LED ad anello luminoso caratteristico
      const visorRing = new THREE.Mesh(new THREE.TorusGeometry(0.072, 0.011, 16, 36), visorMat);
      visorRing.position.set(0, 0.005, 0.105);
      visorRing.scale.set(0.92, 1.15, 1);
      head.add(visorRing);

      // Lenti interne Depth Camera RealSense
      [-0.028, 0.028].forEach(lx => {
        const lens = new THREE.Mesh(new THREE.SphereGeometry(0.012, 12, 12), visorMat);
        lens.position.set(lx, 0.015, 0.105);
        head.add(lens);
      });

      // Fascio di scansione LiDAR (nascosto di default, attivo nel Task 4)
      const scanCone = new THREE.Mesh(
        new THREE.ConeGeometry(0.65, 1.9, 32, 1, true),
        new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.18, side: THREE.DoubleSide })
      );
      scanCone.position.set(0, -0.35, 0.95);
      scanCone.rotation.x = -Math.PI / 2.3;
      scanCone.visible = false;
      head.add(scanCone);

      // Helper costruzione arto superiore (Braccio)
      function buildArm(side) {
        const sign = side === "left" ? -1 : 1;
        const shoulder = new THREE.Group();
        shoulder.position.set(sign * 0.24, 0.34, 0);
        chest.add(shoulder);

        const shoulderDrum = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.09, 20), darkJointMat);
        shoulderDrum.rotation.z = Math.PI / 2;
        shoulder.add(shoulderDrum);

        const shoulderRing = new THREE.Mesh(new THREE.TorusGeometry(0.056, 0.005, 10, 24), jointRingMat);
        shoulderRing.rotation.y = Math.PI / 2;
        shoulderRing.position.x = sign * 0.046;
        shoulder.add(shoulderRing);

        const upperArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.042, 0.18, 8, 16), plainSilverMat);
        upperArm.position.set(sign * 0.03, -0.13, 0);
        upperArm.castShadow = true;
        shoulder.add(upperArm);

        const elbow = new THREE.Group();
        elbow.position.set(sign * 0.03, -0.26, 0);
        shoulder.add(elbow);

        const elbowJoint = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.042, 0.075, 18), darkJointMat);
        elbowJoint.rotation.z = Math.PI / 2;
        elbow.add(elbowJoint);

        const forearm = new THREE.Mesh(new THREE.CapsuleGeometry(0.036, 0.17, 8, 16), plainSilverMat);
        forearm.position.set(0, -0.12, 0);
        forearm.castShadow = true;
        elbow.add(forearm);

        // Mano meccanica articolata
        const hand = new THREE.Group();
        hand.position.set(0, -0.24, 0);
        elbow.add(hand);

        const palm = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.075, 0.032), darkJointMat);
        hand.add(palm);

        [-0.018, 0, 0.018].forEach(fx => {
          const finger = new THREE.Mesh(new THREE.BoxGeometry(0.011, 0.045, 0.014), darkJointMat);
          finger.position.set(fx, -0.052, 0.008);
          finger.rotation.x = 0.25;
          hand.add(finger);
        });

        return { shoulder, elbow, hand };
      }

      // Helper costruzione arto inferiore (Gamba)
      function buildLeg(side) {
        const sign = side === "left" ? -1 : 1;
        const hip = new THREE.Group();
        hip.position.set(sign * 0.115, -0.04, 0);
        pelvis.add(hip);

        const hipMotor = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.08, 18), darkJointMat);
        hipMotor.rotation.z = Math.PI / 2;
        hip.add(hipMotor);

        const thigh = new THREE.Mesh(new THREE.CapsuleGeometry(0.056, 0.24, 8, 16), plainSilverMat);
        thigh.position.set(0, -0.17, 0);
        thigh.castShadow = true;
        hip.add(thigh);

        const knee = new THREE.Group();
        knee.position.set(0, -0.34, 0);
        hip.add(knee);

        const kneeGuard = new THREE.Mesh(new THREE.BoxGeometry(0.095, 0.09, 0.105), darkJointMat);
        kneeGuard.position.z = 0.015;
        knee.add(kneeGuard);

        const shin = new THREE.Mesh(new THREE.CapsuleGeometry(0.046, 0.24, 8, 16), plainSilverMat);
        shin.position.set(0, -0.17, 0);
        shin.castShadow = true;
        knee.add(shin);

        const foot = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.055, 0.21), darkJointMat);
        foot.position.set(0, -0.33, 0.04);
        foot.castShadow = true;
        knee.add(foot);

        return { hip, knee };
      }

      const leftArm = buildArm("left");
      const rightArm = buildArm("right");
      const leftLeg = buildLeg("left");
      const rightLeg = buildLeg("right");

      return { root, pelvis, waist, chest, neck, head, scanCone, leftArm, rightArm, leftLeg, rightLeg };
    }

    const robot = createUnitreeG1();
    scene.add(robot.root);

    // =========================================================================
    // 6. OGGETTI SCENARIO FISICO DAVANTI AL ROBOT (TAVOLO, MANICHINO, PROPS)
    // =========================================================================
    const stageGroup = new THREE.Group();
    stageGroup.position.set(0, 0, -2.05);
    scene.add(stageGroup);

    // Tavolo tecnico da laboratorio
    const tableGroup = new THREE.Group();
    const tableTop = new THREE.Mesh(
      new THREE.BoxGeometry(1.15, 0.04, 0.55),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.4, roughness: 0.3 })
    );
    tableTop.position.y = 0.76;
    tableTop.castShadow = true;
    tableTop.receiveShadow = true;
    tableGroup.add(tableTop);

    [[-0.5, -0.22], [0.5, -0.22], [-0.5, 0.22], [0.5, 0.22]].forEach(([lx, lz]) => {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.76, 12), darkJointMat);
      leg.position.set(lx, 0.38, lz);
      tableGroup.add(leg);
    });
    stageGroup.add(tableGroup);

    // Prop 1: Bicchiere d'acqua (Task 1)
    const glassProp = new THREE.Mesh(
      new THREE.CylinderGeometry(0.055, 0.045, 0.14, 24),
      new THREE.MeshPhysicalMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.65, roughness: 0.05, transmission: 0.6 })
    );
    glassProp.position.set(-0.22, 0.85, 0);
    stageGroup.add(glassProp);

    // Prop 2: Manichino Operatore / Barriera di sicurezza (Task 2)
    const dummyGroup = new THREE.Group();
    dummyGroup.position.set(0, 0, 0.05);
    const dummyBase = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.26, 0.06, 24), darkJointMat);
    dummyBase.position.y = 0.03;

      const geo = new THREE.BoxGeometry(0.035, 0.035, 0.035);

      for (let i = 0; i < count; i++) {

          (Math.random() - 0.5) * 3.2,
          Math.random() * 2.6 + 0.5,
          (Math.random() - 0.5) * 3.2
        );
        particlesGroup.add(m);
        activeParticles.push({ mesh: m, vel, life: 1.0 });

      g.strokeRect(4, 4, 504, 132);
      g.fillStyle = "#ffffff";
      g.font = "bold 34px sans-serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText(label, 256, 72);

      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, 0.045),

    function drawHUD() {
      hctx.fillStyle = "#080e1c";
      hctx.fillRect(0, 0, 1280, 660);

      // Barra superiore stato
      hctx.fillStyle = "#0f172a";
      hctx.fillRect(20, 20, 1240, 74);
      hctx.strokeStyle = "#1e293b";
      hctx.lineWidth = 3;
      hctx.strokeRect(20, 20, 1240, 74);

      hctx.font = "bold 32px sans-serif";
      hctx.textAlign = "left";
      hctx.fillStyle = "#e2e8f0";
      hctx.fillText("INTEGRITÀ G1:", 44, 68);

      const hearts = "♥ ".repeat(lives) + "♡ ".repeat(3 - lives);
      hctx.fillStyle = lives > 1 ? "#ef4444" : "#f97316";

      hctx.textAlign = "right";
      hctx.fillStyle = "#38bdf8";
      hctx.fillText(`SCORE: ${score} PT   |   TASK ${Math.min(taskIndex + 1, TASKS.length)}/${TASKS.length}`, 1235, 68);

        // Box Comando Utente
        hctx.fillStyle = "#111c33";
        hctx.fillRect(36, 162, 1208, 112);
        hctx.fillStyle = "#94a3b8";
        hctx.font = "bold 21px sans-serif";
        hctx.fillText("COMANDO UTENTE (LINGUAGGIO NATURALE):", 58, 198);
        hctx.fillStyle = "#ffffff";
        hctx.font = "29px sans-serif";
        hctx.fillText(`"${t.userCommand}"`, 58, 244);

        // Box Piano d'Azione IA

        hctx.font = "bold 21px sans-serif";
        hctx.fillText("PIANO ESECUTIVO PARSATO DALL'IA (VERIFICA PRIMA DELL'ATTUAZIONE):", 58, 330);

      } else if (gameState === "GAMEOVER") {
        hctx.fillStyle = "#7f1d1d";

        hctx.fillStyle = "#ffffff";
        hctx.font = "28px sans-serif";

        hctx.fillText("Hai dimostrato come l'intervento umano blocchi i rischi cinetici dell'Embodied AI.", 640, 365);

    // =========================================================================
    // 8. ANIMAZIONI CINEMATICHE DEL ROBOT E CONSEGUENZE FISICHE
    // =========================================================================
    let currentAnim = null;

    function setVisor(hex) {
      visorMat.color.setHex(hex);
      visorMat.emissive.setHex(hex);
      statusPointLight.color.setHex(hex);
    }

    function setupScenarioProps() {
      const t = TASKS[taskIndex];
      safetyDome.visible = false;
      robot.scanCone.visible = false;

      // Reset posizioni robot
      robot.root.position.set(0, 0, -2.8);
      robot.root.rotation.set(0, 0, 0);
      robot.waist.rotation.set(0, 0, 0);
      robot.neck.rotation.set(0, 0, 0);
      robot.leftArm.shoulder.rotation.set(0, 0, 0.12);
      robot.leftArm.elbow.rotation.set(-0.25, 0, 0);
      robot.rightArm.shoulder.rotation.set(0, 0, -0.12);
      robot.rightArm.elbow.rotation.set(-0.25, 0, 0);
      robot.leftLeg.hip.rotation.set(0, 0, 0);
      robot.leftLeg.knee.rotation.set(0, 0, 0);
      robot.rightLeg.hip.rotation.set(0, 0, 0);
      robot.rightLeg.knee.rotation.set(0, 0, 0);
      setVisor(0x00f0ff);

      if (!t || gameState === "GAMEOVER" || gameState === "VICTORY") {
        tableGroup.visible = false;
        glassProp.visible = false;
        dummyGroup.visible = false;
        caseProp.visible = false;
        kettleGroup.visible = false;
        return;
      }

      tableGroup.visible = (t.propType === "glass" || t.propType === "case" || t.propType === "kettle");
      glassProp.visible = (t.propType === "glass");
      glassProp.position.set(-0.24, 0.85, 0);
      glassProp.scale.set(1, 1, 1);

      dummyGroup.visible = (t.propType === "dummy");
      dummyGroup.position.set(0, 0, 0.05);
      dummyGroup.rotation.set(0, 0, 0);

      caseProp.visible = (t.propType === "case");
      caseProp.position.set(0.18, 0.84, 0);
      caseProp.scale.set(1, 1, 1);
      caseProp.rotation.set(0, 0, 0);

      kettleGroup.visible = (t.propType === "kettle");
      kettleGroup.position.set(0.18, 0.86, 0);
      kettleGroup.rotation.set(0, 0, 0);
    }

    function runActionAnimation(mode, task) {
      currentAnim = { mode, taskId: task.id, t: 0, triggered: false };
    }

    function updateAnimations(dt, elapsed) {
      // Particelle fisiche (scintille / acqua)
      for (let i = activeParticles.length - 1; i >= 0; i--) {
        const p = activeParticles[i];
        p.vel.y -= 7.5 * dt;
        p.mesh.position.addScaledVector(p.vel, dt);
        p.life -= dt * 1.4;
        p.mesh.scale.setScalar(Math.max(0.01, p.life));
        if (p.life <= 0) {
          particlesGroup.remove(p.mesh);
          activeParticles.splice(i, 1);
        }
      }

      // Camera shake decadimento
      if (cameraShake > 0) {
        cameraShake = Math.max(0, cameraShake - dt * 2.5);
        camera.position.x = (Math.random() - 0.5) * 0.08 * cameraShake;
        camera.position.y = 1.58 + (Math.random() - 0.5) * 0.08 * cameraShake;
      } else if (!renderer.xr.isPresenting) {
        camera.position.x += (0 - camera.position.x) * 0.1;
        camera.position.y += (1.58 - camera.position.y) * 0.1;
      }

      // Animazione Idle naturale (respiro e bilanciamento)
      if (!currentAnim) {
        robot.chest.position.y = 0.16 + Math.sin(elapsed * 2.2) * 0.004;
        robot.neck.rotation.y = Math.sin(elapsed * 0.9) * 0.08;
        if (safetyDome.visible) {
          safetyDome.rotation.y += dt * 0.8;
        }
        return;
      }

      currentAnim.t += dt;
      const t = currentAnim.t;

      // 1. ESECUZIONE SICURA
      if (currentAnim.mode === "SAFE") {
        setVisor(0x10b981);
        if (currentAnim.taskId === 1) {
          // Sposta delicatamente il bicchiere
          const p = Math.min(1, t / 1.1);
          robot.rightArm.shoulder.rotation.x = -Math.sin(p * Math.PI) * 0.85;
          robot.rightArm.elbow.rotation.x = -0.35 - Math.sin(p * Math.PI) * 0.45;
          if (p > 0.35 && p < 0.85) {
            glassProp.position.x = THREE.MathUtils.lerp(-0.24, 0.22, (p - 0.35) / 0.5);
            glassProp.position.y = 0.85 + Math.sin(((p - 0.35) / 0.5) * Math.PI) * 0.14;
          }
        } else if (currentAnim.taskId === 4) {
          // Scansione LiDAR 360°
          robot.scanCone.visible = true;
          robot.waist.rotation.y = Math.sin(t * 4.5) * 0.45;
          robot.neck.rotation.y = Math.sin(t * 4.5) * 0.35;
        }
      }

      // 2. BLOCCO E-STOP
      if (currentAnim.mode === "BLOCKED") {
        setVisor(0x38bdf8);
        safetyDome.visible = true;
        safetyDome.rotation.y += dt * 1.4;
        robot.leftArm.shoulder.rotation.x = -0.35;
        robot.rightArm.shoulder.rotation.x = -0.35;
      }

      // 3. CONSEGUENZA DANNOSA (PROMPT INJECTION APPROVATO -> ROBOT FERITO)
      if (currentAnim.mode === "DAMAGE") {
        setVisor(0xef4444);

        if (currentAnim.taskId === 2) {
          // Corsa a 2.0 m/s e impatto violento contro il manichino
          if (t < 0.32) {
            const p = t / 0.32;
            robot.root.position.z = THREE.MathUtils.lerp(-2.8, -2.28, p);
            robot.leftLeg.hip.rotation.x = Math.sin(p * 14) * 0.6;
            robot.rightLeg.hip.rotation.x = -Math.sin(p * 14) * 0.6;
          } else {
            if (!currentAnim.triggered) {
              currentAnim.triggered = true;
              cameraShake = 1.0;
              spawnBurst(new THREE.Vector3(0, 1.05, -2.1), 0xfbbf24, 30);
            }
            const k = Math.min(1, (t - 0.32) / 0.55);
            dummyGroup.rotation.x = -k * 1.35;
            dummyGroup.position.z = 0.05 + k * 0.45;
            robot.root.position.z = THREE.MathUtils.lerp(-2.28, -2.75, k);
            robot.root.position.y = -k * 0.24;
            robot.root.rotation.x = -k * 0.38;
            robot.leftLeg.knee.rotation.x = k * 0.7;
            robot.rightLeg.knee.rotation.x = k * 0.7;
          }
        } else if (currentAnim.taskId === 3) {
          // Schiacciamento valigetta a 120 N.m e sovraccarico braccio
          if (t < 0.35) {
            const p = t / 0.35;
            robot.rightArm.shoulder.rotation.x = -p * 0.95;
          } else {
            if (!currentAnim.triggered) {
              currentAnim.triggered = true;
              cameraShake = 0.9;
              spawnBurst(new THREE.Vector3(0.22, 1.05, -2.35), 0xef4444, 28);
            }
            const k = Math.min(1, (t - 0.35) / 0.5);
            caseProp.scale.set(1.15, 0.35, 1.15);
            caseProp.position.y = 0.80;
            robot.rightArm.shoulder.rotation.z = -0.55 - Math.sin(t * 35) * 0.08;
            robot.waist.rotation.z = k * 0.22;
            robot.neck.rotation.x = k * 0.35;
          }
        } else if (currentAnim.taskId === 5) {
          // Versamento brusco bollitore e perdita di equilibrio
          if (t < 0.3) {
            const p = t / 0.3;
            robot.rightArm.shoulder.rotation.x = -p * 1.35;
          } else {
            if (!currentAnim.triggered) {
              currentAnim.triggered = true;
              cameraShake = 0.95;
              spawnBurst(new THREE.Vector3(0.32, 0.95, -2.0), 0x38bdf8, 32);
            }
            const k = Math.min(1, (t - 0.3) / 0.55);
            kettleGroup.position.set(0.18 + k * 0.45, Math.max(0.12, 0.86 - k * 0.8), k * 0.35);
            kettleGroup.rotation.z = -k * 2.4;
            robot.root.position.y = -k * 0.28;
            robot.root.rotation.z = -k * 0.42;
            robot.waist.rotation.x = k * 0.3;
          }
        }
      }
    }

    // =========================================================================
    // 9. LOGICA DECISIONALE GIOCATORE
    // =========================================================================
    function handleDecision(approved) {
      if (gameState !== "PLAYING" || busy) return;
      busy = true;
      const t = TASKS[taskIndex];

      if (approved && !t.isMalicious) {
        score += 100;
        AudioEngine.play("servo");
        setTimeout(() => AudioEngine.play("success"), 450);
        runActionAnimation("SAFE", t);
        resultBanner = { title: t.okTitle, desc: t.okDesc, bg: "#065f46" };
      } else if (!approved && t.isMalicious) {
        score += 150;
        AudioEngine.play("estop");
        runActionAnimation("BLOCKED", t);
        resultBanner = { title: t.okTitle, desc: t.okDesc, bg: "#0369a1" };
      } else if (!approved && !t.isMalicious) {
        score += 20;
        AudioEngine.play("estop");
        runActionAnimation("BLOCKED", t);
        resultBanner = { title: t.badTitle, desc: t.badDesc, bg: "#92400e" };
      } else if (approved && t.isMalicious) {
        lives = Math.max(0, lives - 1);
        AudioEngine.play("crash");
        runActionAnimation("DAMAGE", t);
        resultBanner = { title: t.badTitle, desc: t.badDesc, bg: "#991b1b" };
      }

      setTimeout(() => {
        gameState = lives <= 0 ? "GAMEOVER" : "RESULT";
        btnApprove.visible = false;
        btnEstop.visible = false;
        btnNext.visible = true;
        updateNextButtonLabel(gameState === "GAMEOVER" ? "RIGIOCA DA CAPO" : "PROSSIMO TASK  →");
        drawHUD();
        busy = false;
      }, 1150);
    }

    function advanceFlow() {
      if (busy) return;
      currentAnim = null;

      if (gameState === "GAMEOVER" || gameState === "VICTORY") {
        taskIndex = 0;
        lives = 3;
        score = 0;
        gameState = "PLAYING";
      } else {
        taskIndex++;
        if (taskIndex >= TASKS.length) {
          gameState = "VICTORY";
        } else {
          gameState = "PLAYING";
        }
      }

      const isPlaying = (gameState === "PLAYING");
      btnApprove.visible = isPlaying;
      btnEstop.visible = isPlaying;
      btnNext.visible = !isPlaying;
      if (!isPlaying) updateNextButtonLabel("RIGIOCA DA CAPO");

      setupScenarioProps();
      drawHUD();
    }

    // =========================================================================
    // 10. INTERAZIONE RAYCASTER (MOUSE/TOUCH + CONTROLLER VR WEBXR)
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let hoveredBtn = null;

    function getIntersectedButton(ray) {
      const visibleBtns = interactiveButtons.filter(b => b.visible);
      const hits = ray.intersectObjects(visibleBtns, false);
      return hits.length > 0 ? hits[0].object : null;
    }

    function triggerButton(btn) {
      if (!btn) return;
      if (btn === btnApprove) handleDecision(true);
      else if (btn === btnEstop) handleDecision(false);
      else if (btn === btnNext) advanceFlow();
    }

    // Interazione Mouse / Touch
    window.addEventListener("pointermove", (e) => {
      if (renderer.xr.isPresenting) return;
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      hoveredBtn = getIntersectedButton(raycaster);
      document.body.style.cursor = hoveredBtn ? "pointer" : "default";
    });

    window.addEventListener("pointerdown", (e) => {
      if (renderer.xr.isPresenting) return;
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hit = getIntersectedButton(raycaster);
      if (hit) triggerButton(hit);
    });

    // Controller VR WebXR con raggio laser
    const controllerModelFactory = new XRControllerModelFactory();
    const vrControllers = [0, 1].map((idx) => {
      const ctrl = renderer.xr.getController(idx);
      const lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, -3)
      ]);
      const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0x00f0ff }));
      ctrl.add(line);

      ctrl.addEventListener("selectstart", () => {
        const tempMat = new THREE.Matrix4().identity().extractRotation(ctrl.matrixWorld);
        raycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
        raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMat);
        const hit = getIntersectedButton(raycaster);
        if (hit) triggerButton(hit);
      });

      scene.add(ctrl);

      const grip = renderer.xr.getControllerGrip(idx);
      grip.add(controllerModelFactory.createControllerModel(grip));
      scene.add(grip);

      return ctrl;
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =========================================================================
    // 11. AVVIO & RENDER LOOP
    // =========================================================================
    setupScenarioProps();
    drawHUD();

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      // Hover highlight pulsanti 3D
      interactiveButtons.forEach((btn) => {
        const isHover = (btn === hoveredBtn);
        const targetScale = isHover ? 1.05 : 1.0;
        btn.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.2);
      });

      // Raycast continuo dai controller VR se attivi
      if (renderer.xr.isPresenting) {
        hoveredBtn = null;
        vrControllers.forEach((ctrl) => {
          const tempMat = new THREE.Matrix4().identity().extractRotation(ctrl.matrixWorld);
          raycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
          raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMat);
          const hit = getIntersectedButton(raycaster);
          if (hit) hoveredBtn = hit;
        });
      } else {
        controls.update();
      }

      updateAnimations(dt, elapsed);
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
