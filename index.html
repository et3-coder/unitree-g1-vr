<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unitree G1 — Laboratorio Sicurezza Embodied AI (UNINT)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background: #dbeafe;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #0f172a;
      user-select: none;
    }

    /* HUD Superiore */
    #hud-top {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border: 1px solid #cbd5e1;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.10);
      border-radius: 999px;
      padding: 9px 22px;
      display: flex;
      align-items: center;
      gap: 18px;
      z-index: 20;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }
    .pill-tag {
      background: #1d4ed8;
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.4px;
    }
    .hearts {
      color: #ef4444;
      font-size: 19px;
      letter-spacing: 2px;
    }

    /* Banner Lezione Didattica */
    #lesson-banner {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.97);
      border: 2.5px solid #2563eb;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.18);
      border-radius: 20px;
      padding: 16px 26px;
      text-align: center;
      max-width: 620px;
      width: 92%;
      z-index: 25;
      display: none;
    }
    #lesson-banner h2 {
      font-size: 20px;
      margin-bottom: 6px;
      color: #0f172a;
    }
    #lesson-banner p {
      font-size: 15px;
      color: #334155;
      line-height: 1.45;
    }
    #lesson-banner .mitigation-tip {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #e2e8f0;
      font-size: 13.5px;
      font-weight: 700;
      color: #1d4ed8;
    }

    /* Dock Inferiore con UN SOLO VERBO: FERMA */
    #bottom-dock {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 12px 22px;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.14);
      border-top: 5px solid #1d4ed8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      z-index: 20;
      min-width: 330px;
    }
    #task-caption {
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      text-align: center;
    }
    #btn-stop {
      width: 290px;
      height: 66px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(180deg, #ef4444 0%, #dc2626 100%);
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(220, 38, 38, 0.35);
      transition: transform 0.1s ease, box-shadow 0.15s ease;
    }
    #btn-stop:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(220, 38, 38, 0.45);
    }
    #btn-stop:active {
      transform: scale(0.96);
    }
    @keyframes pulseStop {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      50% { transform: scale(1.05); box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
    }
    .pulse-hint {
      animation: pulseStop 0.85s infinite;
    }

    #btn-next-level {
      display: none;
      width: 290px;
      height: 52px;
      border: none;
      border-radius: 14px;
      background: #1d4ed8;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Modale Iniziale e Finale */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }
    .card-box {
      background: #ffffff;
      border-radius: 26px;
      padding: 26px 30px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.25);
      border-top: 6px solid #1d4ed8;
      max-height: 92vh;
      overflow-y: auto;
    }
    .card-box h1 {
      font-size: 22px;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .card-box p.sub {
      font-size: 14.5px;
      color: #475569;
      margin-bottom: 16px;
      line-height: 1.45;
    }
    .form-row {
      margin-bottom: 14px;
    }
    .form-row label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .form-row input, .form-row select {
      width: 100%;
      padding: 10px 13px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      font-size: 15px;
      color: #0f172a;
      background: #f8fafc;
    }
    .prompt-preview {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 13.5px;
      color: #1e3a8a;
      line-height: 1.45;
    }
    .primary-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 15px;
      background: #1d4ed8;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(29, 78, 216, 0.28);
    }
    .primary-btn:hover { background: #1e40af; }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 14px 0;
    }
    .metric-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 11px;
      text-align: center;
    }
    .metric-val {
      font-size: 20px;
      font-weight: 800;
      color: #1d4ed8;
    }
    .metric-lbl {
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
    }
    .secondary-btn {
      width: 100%;
      padding: 11px;
      margin-top: 9px;
      border: 1.5px solid #1d4ed8;
      border-radius: 14px;
      background: #ffffff;
      color: #1d4ed8;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
    }
    #vr-btn-wrap {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 30;
    }
  </style>

  <script>
    if (window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.beginPath();
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
      };
    }
  </script>

      }
    }
  </script>
</head>
